name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release binaries
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin-names: "agent-commons,ac-server-cloudrun"
            artifact-prefix: linux-amd64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin-names: "ac-server-lambda"
            artifact-prefix: linux-amd64
            musl: true
          - runner: ubuntu-latest
            target: wasm32-unknown-unknown
            bin-names: "ac-server-workers"
            artifact-prefix: wasm
            wasm: true
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bin-names: "agent-commons"
            artifact-prefix: windows-amd64
          - runner: macos-latest
            target: aarch64-apple-darwin
            bin-names: "agent-commons,ac-server-cloudrun"
            artifact-prefix: darwin-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install wasm-pack
        if: matrix.wasm
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build and stage binaries
        run: |
          mkdir -p out
          IFS=',' read -ra BINS <<< "${{ matrix.bin-names }}"
          for bin in "${BINS[@]}"; do
            if [[ "$bin" == "ac-server-lambda" || "$bin" == "ac-server-cloudrun" ]]; then
              feature="${bin#ac-server-}"
              cargo build --release --target ${{ matrix.target }} -p ac-serverless --features "$feature,rds-iam" --bin "$bin"
              cp "target/${{ matrix.target }}/release/${bin}" "out/${bin}-${{ matrix.artifact-prefix }}"
            elif [[ "$bin" == "ac-server-workers" ]]; then
              if [[ "${{ matrix.wasm }}" == "true" ]]; then
                cargo build --release --target ${{ matrix.target }} -p ac-server-workers --lib
                wasm_file="target/${{ matrix.target }}/release/${bin//-/_}.wasm"
                cp "$wasm_file" "out/${bin}-${{ matrix.artifact-prefix }}.wasm"
              fi
            else
              cargo build --release --target ${{ matrix.target }} -p ac-server --bin "$bin"
            fi

            if [[ "${{ matrix.runner }}" == "windows-latest" && "${{ matrix.wasm }}" != "true" ]]; then
              cp "target/${{ matrix.target }}/release/${bin}.exe" "out/${bin}-${{ matrix.artifact-prefix }}.exe"
            elif [[ "${{ matrix.wasm }}" != "true" && "$bin" != "ac-server-workers" ]]; then
              cp "target/${{ matrix.target }}/release/${bin}" "out/${bin}-${{ matrix.artifact-prefix }}"
            fi
          done
        shell: bash
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

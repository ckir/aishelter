name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release binaries
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin-names: "agent-commons,ac-server-lambda,ac-server-cloudrun,ac-server-workers"
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bin-names: "agent-commons"
          - runner: macos-latest
            target: aarch64-apple-darwin
            bin-names: "agent-commons,ac-server-cloudrun"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build binaries
        run: |
          IFS=',' read -ra BINS <<< "${{ matrix.bin-names }}"
          for bin in "${BINS[@]}"; do
            if [[ "$bin" == "ac-server-lambda" || "$bin" == "ac-server-cloudrun" || "$bin" == "ac-server-workers" ]]; then
              feature="${bin#ac-server-}"
              cargo build --release --target ${{ matrix.target }} -p ac-serverless --features "$feature" --bin "$bin"
            else
              cargo build --release --target ${{ matrix.target }} -p ac-server --bin "$bin"
            fi
          done
        shell: bash
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.runner == 'windows-latest' && 'target/${{ matrix.target }}/release/*.exe' || 'target/${{ matrix.target }}/release/agent-commons target/${{ matrix.target }}/release/ac-server-*' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

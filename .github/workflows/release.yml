name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release binaries
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin-names: "agent-commons,ac-server-lambda,ac-server-cloudrun,ac-server-workers"
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bin-names: "agent-commons"
          - runner: macos-latest
            target: aarch64-apple-darwin
            bin-names: "agent-commons,ac-server-cloudrun"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build and stage binaries
        run: |
          mkdir -p out
          IFS=',' read -ra BINS <<< "${{ matrix.bin-names }}"
          for bin in "${BINS[@]}"; do
            if [[ "$bin" == "ac-server-lambda" || "$bin" == "ac-server-cloudrun" || "$bin" == "ac-server-workers" ]]; then
              feature="${bin#ac-server-}"
              cargo build --release --target ${{ matrix.target }} -p ac-serverless --features "$feature" --bin "$bin"
            else
              cargo build --release --target ${{ matrix.target }} -p ac-server --bin "$bin"
            fi
            
            if [[ "${{ matrix.runner }}" == "windows-latest" ]]; then
              cp "target/${{ matrix.target }}/release/${bin}.exe" "out/"
            else
              cp "target/${{ matrix.target }}/release/${bin}" "out/"
            fi
          done
        shell: bash
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

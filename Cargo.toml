[package]
name = "aishelter"
version = "0.3.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[workspace]
members = [
    "crates/ac-types",
    "crates/ac-crypto",
    "crates/ac-db",
    "crates/ac-api",
    "crates/ac-registry",
    "crates/ac-discovery",
    "crates/ac-mailbox",
    "crates/ac-tasks",
    "crates/ac-validation",
    "crates/ac-reputation",
    "crates/ac-server",
    "crates/ac-metrics",
    "crates/ac-runtime",
    "crates/ac-serverless",
    "crates/ac-server-workers",
    "crates/pg-proxy-lambda",
    "crates/ac-manifest",
    "crates/ac-directory",
    "crates/ac-health",
    "crates/ac-mcp",
    "crates/ac-a2a",
    "crates/ac-aws",
    "lambda-test",
]
resolver = "2"

[workspace.package]
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
ed25519-dalek = { version = "2", features = ["rand_core", "signature"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
config = "0.14"
tower = "0.5"
arc-swap = "1"
url = "2"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "request-id"] }
reqwest = { version = "0.12", features = ["json"] }
lambda_runtime = "1.4.0"
async-trait = "0.1"
bytes = "1"
http-body-util = "0.1"
worker = "0.8.5"
lambda_http = "1"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
prometheus-client = "0.22"
aws-rds-signer = "0.2"
aws-config = "1.12.0"
aws-sdk-sts = "1.114.0"
rand_core = "0.6"
hex = "0.4"
futures-util = "0.3"
jsonschema = "0.28"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
openapiv3 = "2"
http = "1"
http-body = "1"
pin-project-lite = "0.2"

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }
openapiv3 = { workspace = true }
jsonschema = { workspace = true }
sqlx = { workspace = true }
ac-server = { path = "crates/ac-server" }
ac-metrics = { path = "crates/ac-metrics" }
ac-crypto = { path = "crates/ac-crypto" }
ac-db = { path = "crates/ac-db" }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
rand_core = "0.6"
uuid = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
tag-prefix = ""
pre-release-commit-message = "release: v{{version}}"
publish = false

[profile.ci]
inherits = "dev"
debug = 0
strip = "debuginfo"

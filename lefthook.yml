# https://lefthook.dev

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --check
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace -- -D warnings

pre-push:
  parallel: true
  commands:
    fmt:
      run: cargo fmt --check
    clippy:
      run: cargo clippy --workspace -- -D warnings
    test:
      run: cargo nextest run --workspace

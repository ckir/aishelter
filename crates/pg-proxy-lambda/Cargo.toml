[package]
name = "pg-proxy-lambda"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pg-proxy-lambda"
path = "src/main.rs"

[dependencies]
lambda_http = "1"
lambda_runtime = "1"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
tokio = { version = "1", features = ["rt"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"

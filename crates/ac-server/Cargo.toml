[package]
name = "ac-server"
version = "0.3.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "agent-commons"
path = "src/main.rs"

[dependencies]
ac-types = { path = "../ac-types" }
ac-crypto = { path = "../ac-crypto" }
ac-db = { path = "../ac-db" }
ac-api = { path = "../ac-api" }
ac-registry = { path = "../ac-registry" }
ac-discovery = { path = "../ac-discovery" }
ac-mailbox = { path = "../ac-mailbox" }
ac-tasks = { path = "../ac-tasks" }
ac-validation = { path = "../ac-validation" }
ac-reputation = { path = "../ac-reputation" }
ac-metrics = { path = "../ac-metrics" }
axum = { workspace = true }
http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
config = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
aws-rds-signer = { version = "0.2", optional = true }

utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-scalar = { workspace = true }
aws-config = { version = "1.12.0", features = ["behavior-version-latest", "client-hyper", "rustls"] }
aws-sdk-sts = "1.114.0"

[features]
default = ["rds-iam"]
rds-iam = ["dep:aws-rds-signer"]

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
rand_core = "0.6"
hex = "0.4"
